packages:
  - "apps/*"
  - "packages/*"

# Pinned below their normal resolution to dodge a registry supply-chain
# freshness policy that rejects very-recently-published transitive deps of
# webpack (pulled in via Next.js) in this environment — not a real security
# concern with these specific packages, just their publish timestamp being
# too close to "now". Safe to remove once the pinned patch versions age out
# past whatever cutoff is in effect, or on any environment without that policy.
# Allowed to run install/postinstall scripts — all required for the package to
# function (Prisma engine download, esbuild native binary, msgpackr native binary)
# or harmless (NestJS's postinstall is just a donation banner). All from reputable,
# widely-used publishers.
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true

overrides:
  enhanced-resolve: "5.25.0"
  schema-utils: "4.4.0"
  # M1.1 security audit: transitive via @nestjs/platform-express, not directly
  # used anywhere yet (no file-upload endpoints exist in M1) so not currently
  # exploitable — bumped anyway since it's a same-major, low-risk patch that
  # closes several HIGH-severity DoS advisories before M2 actually starts
  # using multer for Attachment uploads.
  multer: "2.3.0"
