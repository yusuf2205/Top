# Traefik static configuration — production/staging.
# Chosen over Nginx because it auto-discovers Docker containers via labels (no manual
# reverse-proxy config edit per deploy). Kept for host-based routing (app.<domain> vs
# api.<domain> both reach this one container) and the rate-limit/security-header
# middlewares — see infrastructure/traefik/dynamic/middlewares.yml.
#
# NOT the public entry point: TLS termination and public exposure are handled by
# Cloudflare Tunnel (the `cloudflared` service — see docker-compose.prod.yml), matching
# how git.mygithub.uz is already exposed. Traefik listens on plain HTTP, reachable only
# from `cloudflared` over the internal Docker network — nothing here is published to
# the host or the internet. This replaces the original port-forward + Let's Encrypt
# design (see FINAL-INFRASTRUCTURE-ARCHITECTURE.md STEP16) now that both domains
# already run behind Cloudflare Tunnel; that plan is kept in the doc as the fallback
# if Cloudflare Tunnel is ever dropped.

api:
  dashboard: true
  insecure: false # dashboard is only reachable through the authenticated router below, not a raw port

entryPoints:
  traefik:
    address: ":8080" # internal only — used by the container's own healthcheck (traefik healthcheck --ping)
  web:
    address: ":80" # internal only — cloudflared is the only thing that ever reaches this

ping:
  entryPoint: traefik

providers:
  docker:
    exposedByDefault: false # a container is only routed if it explicitly opts in via labels
    network: top_internal
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

accessLog: {}
