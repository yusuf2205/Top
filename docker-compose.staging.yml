# Staging overrides. Structurally identical to prod (same images, same Cloudflare
# Tunnel pattern) so staging actually validates what will run in production — only the
# domain, resource ceilings, and tunnel token differ (use a SEPARATE Cloudflare Tunnel
# for staging, not the same one as prod — separate token in .env.staging).
#
# IMPORTANT: run staging with a distinct project name so its volumes/network/containers
# never collide with a production stack on the same NAS:
#   docker compose -p top-procurement-staging --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml up -d --build
# .env.staging sets ENV_FILE_PATH=.env.staging so containers load the right file
# (see docker-compose.yml `env_file:` and .env.staging.example).

services:
  reverse-proxy:
    restart: always
    # No `ports:` — see docker-compose.prod.yml; same Cloudflare Tunnel pattern.
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 96M }

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [top_internal]
    depends_on:
      reverse-proxy:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.1", memory: 96M }

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.3", memory: 384M }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-staging.rule=Host(`${WEB_DOMAIN}`)"
      - "traefik.http.services.web-staging.loadbalancer.server.port=3000"

  api:
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 768M }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-staging.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.services.api-staging.loadbalancer.server.port=4000"

  worker:
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.3", memory: 512M }

  postgres:
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.7", memory: 1536M }

  redis:
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 192M }

  minio:
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.3", memory: 384M }

  backup:
    restart: "no"
